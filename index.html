<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060b16"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Ascend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a personal study hall. Today leads; Learn holds the curriculum (data, photography, interests);
   Reading, Plan (8-week season) and Progress sit beside it. Cards on a quiet grid, one column on phones,
   bottom tab bar under 860px. Dark-first, with a matching light theme. */
:root{
  color-scheme:dark;
  --bg:#060b16;
  --bg-glow:rgba(43,136,216,.13);
  --surface:#0c1628;
  --surface-2:#0f1b30;
  --raise:#13223b;
  --field:#081222;
  --line:rgba(130,180,240,.14);
  --line-2:rgba(130,180,240,.3);
  --ink:#e8f0fb;
  --ink-2:#a9bad2;
  --ink-3:#7a8fad;
  --accent:#63cdff;
  --accent-2:#2b88d8;
  --accent-wash:rgba(99,205,255,.1);
  --accent-soft:rgba(99,205,255,.2);
  --on-accent:#03101d;
  --gold:#ffc65c;
  --gold-wash:rgba(255,198,92,.09);
  --gold-line:rgba(255,198,92,.45);
  --danger:#ff6b7d;
  --danger-wash:rgba(255,107,125,.08);
  --danger-line:rgba(255,107,125,.42);
  --ok:#4fd68b;
  --ok-wash:rgba(79,214,139,.1);
  --track:rgba(130,180,240,.1);
  --shadow:rgba(0,0,0,.35);
  --scrim:rgba(2,6,14,.72);
  --toast:#101d33;
  --top:rgba(6,11,22,.9);
  /* subjects: always shown with a text label */
  --s-data:#9085e9;--s-photo:#d99a1e;--s-reading:#22a77a;--s-interest:#d55181;--s-trip:#e07a3e;--s-review:#7d93b4;
  /* activity heat: one hue, quiet to bright */
  --heat-0:#0f1d33;--heat-1:#123b5e;--heat-2:#17648f;--heat-3:#2496c6;--heat-4:#63cdff;
  --font-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f6fa;--bg-glow:rgba(11,109,179,.06);--surface:#ffffff;--surface-2:#f7f9fc;--raise:#eef3f9;--field:#ffffff;
  --line:rgba(20,50,90,.12);--line-2:rgba(20,50,90,.26);--ink:#0d1a2c;--ink-2:#3d4f69;--ink-3:#5d708c;
  --accent:#0b6db3;--accent-2:#0a5a95;--accent-wash:rgba(11,109,179,.07);--accent-soft:rgba(11,109,179,.16);--on-accent:#ffffff;
  --gold:#946000;--gold-wash:rgba(148,96,0,.07);--gold-line:rgba(148,96,0,.4);
  --danger:#c42f48;--danger-wash:rgba(196,47,72,.06);--danger-line:rgba(196,47,72,.38);--ok:#17804a;--ok-wash:rgba(23,128,74,.08);
  --track:rgba(20,50,90,.08);--shadow:rgba(16,40,80,.07);--scrim:rgba(10,20,40,.38);--toast:#ffffff;--top:rgba(243,246,250,.92);
  --s-data:#5b4fd1;--s-photo:#a76a00;--s-reading:#12815c;--s-interest:#b8336a;--s-trip:#c0571c;--s-review:#4f6a8f;
  --heat-0:#e3eaf3;--heat-1:#b9d7ef;--heat-2:#7db8e3;--heat-3:#3b8fd0;--heat-4:#0b6db3;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f6fa;--bg-glow:rgba(11,109,179,.06);--surface:#ffffff;--surface-2:#f7f9fc;--raise:#eef3f9;--field:#ffffff;
  --line:rgba(20,50,90,.12);--line-2:rgba(20,50,90,.26);--ink:#0d1a2c;--ink-2:#3d4f69;--ink-3:#5d708c;
  --accent:#0b6db3;--accent-2:#0a5a95;--accent-wash:rgba(11,109,179,.07);--accent-soft:rgba(11,109,179,.16);--on-accent:#ffffff;
  --gold:#946000;--gold-wash:rgba(148,96,0,.07);--gold-line:rgba(148,96,0,.4);
  --danger:#c42f48;--danger-wash:rgba(196,47,72,.06);--danger-line:rgba(196,47,72,.38);--ok:#17804a;--ok-wash:rgba(23,128,74,.08);
  --track:rgba(20,50,90,.08);--shadow:rgba(16,40,80,.07);--scrim:rgba(10,20,40,.38);--toast:#ffffff;--top:rgba(243,246,250,.92);
  --s-data:#5b4fd1;--s-photo:#a76a00;--s-reading:#12815c;--s-interest:#b8336a;--s-trip:#c0571c;--s-review:#4f6a8f;
  --heat-0:#e3eaf3;--heat-1:#b9d7ef;--heat-2:#7db8e3;--heat-3:#3b8fd0;--heat-4:#0b6db3;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 600px at 80% -10%,var(--bg-glow),transparent 62%),var(--bg);background-attachment:fixed;color:var(--ink);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:17px;font-weight:600;line-height:1.25}
h3{font-size:15px;font-weight:600;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
b{font-weight:600}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.lbl{font:600 11px/1.3 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.lead{font-size:14.5px;color:var(--ink-2);max-width:72ch}
.hint{font-size:13px;color:var(--ink-3)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top-in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));height:58px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.mark{width:26px;height:26px;color:var(--accent);flex:none}
.b-name{font:700 16px/1 var(--font-display);letter-spacing:.3em}
.b-sub{font:500 11px/1 var(--font-data);color:var(--ink-3);border-left:1px solid var(--line-2);padding-left:10px}
.tabs{display:flex;gap:2px;margin-left:6px}
.tab{position:relative;appearance:none;border:0;background:none;color:var(--ink-2);font:600 13px/1 var(--font-display);letter-spacing:.06em;padding:22px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.quiet{font:500 12px/1 var(--font-data);color:var(--ink-3);white-space:nowrap}
.timerbar{border-top:1px solid var(--line);background:var(--ok-wash)}
.tb-in{max-width:1200px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pulse{width:9px;height:9px;flex:none;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tb-what{color:var(--ink-2);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 140px}
.tb-clock{font:600 17px/1 var(--font-data);font-variant-numeric:tabular-nums}
.tabbar{display:none}
@media (max-width:1060px){.b-sub{display:none}}
@media (max-width:860px){
  .tabs{display:none}
  .top-in{gap:10px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--top);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .tb{appearance:none;border:0;background:none;color:var(--ink-3);display:grid;justify-items:center;gap:3px;padding:6px 0;font:600 10.5px/1 var(--font-display);letter-spacing:.06em;cursor:pointer}
  .tb .ico{width:22px;height:22px}
  .tb.on{color:var(--accent)}
}
@media (max-width:420px){.quiet{display:none}}

/* layout */
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;display:grid;gap:18px}
@media (max-width:860px){.wrap{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}}
.g{display:grid;gap:18px;min-width:0}
.g > *{min-width:0}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.wide-l{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
@media (max-width:980px){.two,.wide-l{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:18px;align-content:start;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-end{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.15}
.page-h p{color:var(--ink-2);margin-top:4px}

/* cards */
.card{min-width:0;padding:18px 20px 20px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px var(--shadow)}
@media (max-width:520px){.card{padding:16px 14px}}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h .meta{margin-left:auto;font:500 12px/1.3 var(--font-data);color:var(--ink-3)}
.card.hl{border-color:var(--gold-line)}
.sub-h{font:600 11.5px/1.3 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.sub-h:first-child{margin-top:0}
.divide > * + *{border-top:1px solid var(--line)}

/* controls */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:4px;background:var(--accent-wash);color:var(--ink);font:600 13px/1 var(--font-display);letter-spacing:.04em;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn .ico{width:15px;height:15px}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{border-color:var(--danger-line);color:var(--danger);background:var(--danger-wash)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.icon-btn{appearance:none;display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border:1px solid var(--line-2);border-radius:3px;font:600 11px/1 var(--font-display);letter-spacing:.06em;color:var(--ink-2);white-space:nowrap}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.gold{border-color:var(--gold-line);color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 7px;border:1px solid var(--line);border-radius:3px;font:500 11.5px/1.6 var(--font-data);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);flex-wrap:wrap}
.seg-b{appearance:none;border:0;border-radius:3px;background:none;color:var(--ink-2);padding:7px 11px;font:600 12.5px/1.2 var(--font-display);letter-spacing:.03em;cursor:pointer}
.seg-b:hover{color:var(--ink)}
.seg-b.on{background:var(--accent-wash);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-soft)}
.form{display:grid;gap:12px;min-width:0}
.fld{display:grid;gap:5px;min-width:0}
.fld > span{font:600 11px/1.3 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line-2);border-radius:4px;background:var(--field);color:var(--ink);font:400 15px/1.4 var(--font-body)}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--ink-3)}
.bar{position:relative;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c,var(--accent))}
.bar.thin{height:5px}

/* checks */
.check{appearance:none;display:flex;align-items:flex-start;gap:11px;width:100%;padding:10px 2px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.check + .check{border-top:1px solid var(--line)}
.check:hover .box{border-color:var(--accent)}
.check .box{flex:none;width:19px;height:19px;margin-top:2px;display:grid;place-items:center;border:1.5px solid var(--line-2);border-radius:4px;color:transparent}
.check .box .ico{width:13px;height:13px;stroke-width:2.6}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check .lbl2{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.check[aria-pressed="true"] .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.check .aside{flex:none;font:500 12px/1.6 var(--font-data);color:var(--ink-3)}

/* today */
.block{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0}
.block + .block{border-top:1px solid var(--line)}
.block .dur{min-width:58px;padding:8px 0;text-align:center;border:1px solid var(--line-2);border-radius:5px}
.block .dur b{display:block;font:600 17px/1 var(--font-data)}
.block .dur span{font:500 10.5px/1.4 var(--font-data);color:var(--ink-3)}
.block .what{min-width:0}
.block .what p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
@media (max-width:520px){.block{grid-template-columns:auto minmax(0,1fr)}.block > .btn{grid-column:2;justify-self:start}}
.meters{display:grid;gap:12px}
.meter{display:grid;gap:5px}
.meter .row-between{font-size:13.5px}
.meter b{font:600 12.5px/1.3 var(--font-data)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.ifthen{display:grid;gap:6px}
.ifthen li{font-size:14px;color:var(--ink-2);padding-left:14px;position:relative}
.ifthen li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--s-reading)}
.note{padding:10px 12px;border-radius:5px;background:var(--accent-wash);color:var(--ink-2);font-size:14px}
.note.warn{background:var(--gold-wash);color:var(--ink)}

/* learn */
.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.ev-item{padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2)}
.ev-item b{display:block;font-size:13.5px}
.ev-item span{font-size:13px;color:var(--ink-2)}
.stages{display:grid}
.stage{border-top:1px solid var(--line)}
.stage:first-child{border-top:0}
.stage-h{appearance:none;width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.stage-h .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);font:600 12px/1 var(--font-data);color:var(--ink-2)}
.stage.done .stage-h .n{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.stage.open .stage-h .n{border-color:var(--accent);color:var(--accent)}
.stage-h .st-t{display:block;font:600 15px/1.3 var(--font-display)}
.stage-h small{display:block;color:var(--ink-3);font:500 12px/1.4 var(--font-data)}
.stage-h .prog{display:flex;align-items:center;gap:8px;font:500 12px/1 var(--font-data);color:var(--ink-3)}
.stage-h .prog .bar{width:70px}
.stage-b{padding:0 2px 16px 40px;display:grid;gap:10px}
@media (max-width:520px){.stage-b{padding-left:2px}}
.why{font-size:14px;color:var(--ink-2)}
.reps{font-size:13.5px;padding:8px 12px;border-left:3px solid var(--s-data);background:var(--surface-2);border-radius:0 4px 4px 0}
.links{display:grid;gap:2px}
.links li{display:grid;grid-template-columns:minmax(0,1fr);padding:6px 0}
.links a{display:inline-flex;align-items:center;gap:4px;font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.links a .ico{width:13px;height:13px}
.links small{display:block;color:var(--ink-3);font-size:12.5px}
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.proj{display:grid;gap:6px;align-content:start;padding:12px 14px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2)}
.proj p{font-size:13.5px;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 11px/1.3 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.k{font-weight:600;white-space:nowrap}
.tbl td.v{color:var(--ink-2)}
.tbl select{min-width:110px;padding:5px 8px;font-size:13.5px}
.steps{display:flex;gap:8px;flex-wrap:wrap;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:5px;font-size:13.5px}
.steps li::before{content:counter(s);font:600 12px/1 var(--font-data);color:var(--s-photo)}
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.icard{display:grid;gap:10px;align-content:start;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.icard.focus{border-color:var(--s-interest)}

/* =====================================================================
   DERIVED NUMBERS
   ===================================================================== */
function levelInfo(xp) {
  let level = 1, need = 80, acc = 0;
  while (xp >= acc + need) { acc += need; level++; need = 50 + 30 * level; }
  return { level, into: xp - acc, need };
}
function habitsDone(k) { const P = S.profile, d = getDay(k); return !!(d && P.habits.length && P.habits.every(h => d.done.includes(h.id))); }
function seasonWeek(P, today) { return Math.floor(daysBetween(P.season.start, today) / 7) + 1; }
function targets(P) { const t = {}; for (const day of P.rhythm) for (const it of day) t[it.s] = (t[it.s] || 0) + (+it.min || 0); return t; }
function derive() {
  const P = S.profile, today = dayKey(), ws = weekStart(today);
  const D = { today, ws, total: 0, entries: [], dayXP: {}, dayMin: {}, dayPages: {}, weekMin: {}, seasonMin: {}, allMin: {}, pagesWeek: 0, pagesToday: 0, readMinToday: 0, studyToday: {}, sessionsWeek: 0, pagesAll: 0, booksDone: 0 };
  const sStart = P.season.start;
  for (const mk in S.months) for (const e of S.months[mk].log) if (e && e.k) D.entries.push(e);
  D.entries.sort((x, y) => y.t - x.t);
  for (const e of D.entries) {
    const xp = +e.xp || 0; D.total += xp; D.dayXP[e.day] = (D.dayXP[e.day] || 0) + xp;
    const s = (SUBJ[e.a] && SUBJ[e.a].c) || e.a;
    const min = +e.min || 0, pages = +e.pages || 0;
    if (min) {
      D.dayMin[e.day] = (D.dayMin[e.day] || 0) + min;
      D.allMin[s] = (D.allMin[s] || 0) + min;
      if (e.day >= ws) D.weekMin[s] = (D.weekMin[s] || 0) + min;
      if (e.day >= sStart) D.seasonMin[s] = (D.seasonMin[s] || 0) + min;
      if (e.day === today) D.studyToday[s] = (D.studyToday[s] || 0) + min;
    }
    if (e.k === 'study' && e.day >= ws) D.sessionsWeek++;
    if (pages) { D.dayPages[e.day] = (D.dayPages[e.day] || 0) + pages; D.pagesAll += pages; if (e.day >= ws) D.pagesWeek += pages; if (e.day === today) D.pagesToday += pages; }
    if (e.k === 'read' && e.day === today) D.readMinToday += min;
    if (e.k === 'book') D.booksDone++;
  }
  Object.assign(D, levelInfo(D.total));
  D.targets = targets(P);
  D.weekTarget = Object.values(D.targets).reduce((a, b) => a + b, 0);
  D.weekTotal = Object.values(D.weekMin).reduce((a, b) => a + b, 0);
  // daily minimums streak: today counts once done; otherwise count up to yesterday
  let n = 0, k = habitsDone(today) ? today : addDays(today, -1);
  while (n < 4000 && k >= P.createdAt && habitsDone(k)) { n++; k = addDays(k, -1); }
  D.streak = n;
  const y = addDays(today, -1);
  D.missedYesterday = y >= P.createdAt && !habitsDone(y);
  D.week = seasonWeek(P, today);
  D.seasonDays = P.season.weeks * 7;
  D.seasonEnd = addDays(P.season.start, D.seasonDays - 1);
  D.appsWeek = P.apps.filter(a => isDay(a.date) && a.date >= ws && a.status !== 'saved').length;
  // reading pace over the last 14 days
  let p14 = 0; for (let i = 0; i < 14; i++) p14 += D.dayPages[addDays(today, -i)] || 0;
  D.pace = p14 / 14;
  return D;
}
function stageProgress(st) { const P = S.profile; const done = st.m.filter((_, i) => P.done[`d.${st.id}.${i}`]).length; return { done, total: st.m.length }; }
function currentStage() { return DATA_PATH.find(st => stageProgress(st).done < st.m.length) || DATA_PATH[0]; }
function nextMilestone(s) {
  const P = S.profile;
  if (s === 'data') { const st = currentStage(); const i = st.m.findIndex((_, j) => !P.done[`d.${st.id}.${j}`]); return i >= 0 ? `${st.t}: ${st.m[i]}` : st.t; }
  if (s === 'photo') { const i = PHOTO_MODULES.findIndex((_, j) => !P.done[`p.${j}`]); return i >= 0 ? PHOTO_MODULES[i] : 'Shoot freely and pick your next project'; }
  if (s === 'interest') { const it = P.interests.find(x => x.id === P.season.interest) || P.interests.find(x => x.status === 'exploring'); return it ? `Interest: ${it.name}` : 'Pick an interest in Learn'; }
  if (s === 'reading') { const b = P.books.find(x => x.status === 'reading'); return b ? `Continue ${b.title}` : 'Pick a book'; }

}

const XP = { study: 1, page: 2, habit: 5, milestone: 20, checkpoint: 30, make: 100, trip: 40, review: 30, note: 5, apply: 10, book: 50 };
function toast(html, ms = 3200) {
  const root = $('#toasts'); if (!root) return;
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = html;
  root.appendChild(el); setTimeout(() => el.remove(), ms);
  while (root.children.length > 3) root.firstChild.remove();
}
function log(o) {
  const t = o.t || Date.now(), day = o.day || dayKey(new Date(t));
  const e = { id: uid(), t, day, k: o.k, a: o.a, xp: Math.max(0, Math.round(o.xp || 0)) };
  for (const f of ['s', 'min', 'pages', 'ref', 'start']) if (o[f] != null && o[f] !== '') e[f] = o[f];
  if (o.n) e.n = String(o.n).slice(0, 600);
  const mk = monthKeyOf(day); month(mk).log.push(e); saveMonth(mk);
  return e;
}
function removeWhere(pred) { for (const mk in S.months) { const m = S.months[mk], n = m.log.length; m.log = m.log.filter(e => !pred(e)); if (m.log.length !== n) saveMonth(mk); } }
function act(fn) {
  if (!S.profile) return;
  const before = levelInfo(derive().total).level;

}
function setHabit(id, on, k) {

}
function autoHabits() {

}

function updateBook(id, page, minutes, note) {
  act(() => {

    const total = Math.max(1, +b.total || 1), to = Math.max(0, Math.min(total, Math.round(page)));

function deleteEntry(id) {

}

/* ----- progress ----- */
function heatSVG(D) {
  const weeks = 17, cell = 12, step = 15, left = 26, top = 16;
  const start = addDays(weekStart(D.today), -7 * (weeks - 1));
  const W = left + weeks * step, H = top + 7 * step;
  let s = `<svg class="heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Study minutes and pages per day over the last ${weeks} weeks">`;
  [['Mon', 0], ['Wed', 2], ['Fri', 4]].forEach(([l, r]) => { s += `<text x="0" y="${top + r * step + 10}" class="hl">${l}</text>`; });
  let lastMon = '', lastW = -9;
  for (let w = 0; w < weeks; w++) {
    const col = addDays(start, w * 7), mon = parseDay(col).toLocaleDateString('en-ZA', { month: 'short' });
    if (mon !== lastMon) { if (w - lastW >= 3 && w < weeks - 1) { s += `<text x="${left + w * step}" y="10" class="hl">${mon}</text>`; lastW = w; } lastMon = mon; }
    for (let r = 0; r < 7; r++) {
      const k = addDays(col, r); if (k > D.today) continue;
      const min = Math.round(D.dayMin[k] || 0), pg = D.dayPages[k] || 0, score = min + pg * 2;
      const lv = score === 0 ? 0 : score < 20 ? 1 : score < 45 ? 2 : score < 90 ? 3 : 4;
      s += `<rect x="${left + w * step}" y="${top + r * step}" width="${cell}" height="${cell}" rx="2" class="h${lv}${k === D.today ? ' today' : ''}" data-tip="${esc(fmtDay(k))} · ${hm(min)} studied · ${pg} pages"/>`;
    }
  }
  return s + '</svg>';
}
function whenLabel(e) {
  const today = dayKey();
  if (e.day === today) { const d = new Date(e.t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  if (e.day === addDays(today, -1)) return 'Yesterday';
  return fmtDay(e.day, { day: 'numeric', month: 'short' });
}
function kindLabel(e) {
  const s = subj(e.a).name;
  switch (e.k) {
    case 'study': case 'train': return `${s} · ${hm(e.min)}${e.s ? ' · ' + (focusName((SUBJ[e.a] && SUBJ[e.a].c) || e.a, e.s) || '') : ''}`;
    case 'read': return `Reading · ${e.pages ? plural(e.pages, 'page') : hm(e.min)}`;
    case 'habit': return 'Daily minimum';
    case 'milestone': return 'Milestone';
    case 'checkpoint': return 'Checkpoint';
    case 'make': return 'Made';
    case 'trip': return 'Field trip';
    case 'review': return 'Review';
    case 'note': return 'Interest note';
    case 'apply': return 'Application';
    case 'book': return 'Book finished';
    case 'reward': return 'Reward earned';
    default: return 'Entry';
  }
}

document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) return; const el = $('#tip'); el.textContent = t.getAttribute('data-tip'); el.hidden = false; placeTip(e); });
document.addEventListener('pointermove', e => { const el = $('#tip'); if (el && !el.hidden) placeTip(e); }, { passive: true });
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('[data-tip]')) $('#tip').hidden = true; });

/* =====================================================================
   BOOT
   ===================================================================== */
function readUI() {
  try { const u = JSON.parse(localStorage.getItem('ascend-ui2') || '{}'); if (VIEW_KEYS.includes(u.view)) S.view = u.view; if (['data', 'photo', 'interests'].includes(u.learnTab)) S.learnTab = u.learnTab; } catch (e) {}
  const h = (location.hash || '').slice(1);
  if (VIEW_KEYS.includes(h)) S.view = h;
}
function persistUI() { try { localStorage.setItem('ascend-ui2', JSON.stringify({ view: S.view, learnTab: S.learnTab })); } catch (e) {} }
function tick() {
  const P = S.profile; if (!P || !S.loaded) return;
  if (P.timer) { const el = document.getElementById('timer-clock'); if (el) el.textContent = clock(Date.now() - P.timer.start); }
  const t = dayKey();
  if (S.lastDay && t !== S.lastDay) { S.lastDay = t; render(); }
}
function boot() {
  S.lastDay = dayKey();
  if (S.store.kind === 'memory') toast('This browser is blocking storage, so progress will not be saved.', 6000);
  if (S.profile && S.profile.migrated) { delete S.profile.migrated; saveProfile(); }
  render();
}
function start(data) {
  if (data && VIEW_KEYS.includes(data.view)) { S.view = data.view; S.learnTab = data.learnTab || 'data'; S.drafts = data.drafts || {}; }
  else readUI();
  render();
  (async () => {
    try { S.sample = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('sample') : null; } catch (e) { S.sample = null; }
    if (S.loaded) scheduleRender();
  })();
  connect();
  setInterval(tick, 1000);
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: S.view, learnTab: S.learnTab, drafts: S.drafts })); } catch (e) {}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body></html>
